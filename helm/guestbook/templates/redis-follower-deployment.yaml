apiVersion: apps/v1 #  for k8s versions before 1.9.0 use apps/v1beta2  and before 1.8.0 use extensions/v1beta1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis-follower
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-redis
      role: {{ .Release.Name }}-follower
      tier: {{ .Release.Name }}-backend
  replicas: {{ .Values.redis.follower.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-redis
        role: {{ .Release.Name }}-follower
        tier: {{ .Release.Name }}-backend
    spec:
      containers:
      - name: follower
        image: us-docker.pkg.dev/google-samples/containers/gke/gb-redis-follower:v2
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
        env:
        - name: GET_HOSTS_FROM
          value: env
        - name: REDIS_LEADER_SERVICE_HOST
          value: {{ .Release.Name }}-redis-leader
        - name: REDIS_FOLLOWER_SERVICE_HOST
          value: {{ .Release.Name }}-redis-follower
        ports:
        - containerPort: 6379
