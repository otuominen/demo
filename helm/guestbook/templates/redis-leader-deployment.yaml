apiVersion: apps/v1 #  for k8s versions before 1.9.0 use apps/v1beta2  and before 1.8.0 use extensions/v1beta1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis-leader
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-redis
      role: {{ .Release.Name }}-leader
      tier: {{ .Release.Name }}-backend
  replicas: {{ .Values.redis.leader.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-redis
        role: {{ .Release.Name }}-leader
        tier: {{ .Release.Name }}-backend
    spec:
      containers:
      - name: leader
        image: docker.io/redis:6.0.5  # or just image: redis
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
        ports:
        - containerPort: 6379
